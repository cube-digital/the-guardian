# Project-specific Codex review policy.

review_goals:
  - catch correctness bugs before human review
  - identify security regressions and authorization mistakes
  - identify missing tests for risky behavior
  - avoid subjective style comments

risk_profiles:
  authentication:
    paths:
      - app/auth/**
      - app/authentication/**
    required_review:
      - token lifecycle
      - callback state validation
      - replay protection
      - session fixation
      - missing negative tests

  authorization:
    paths:
      - app/authorization/**
      - app/permissions/**
    required_review:
      - tenant isolation
      - object-level permissions
      - privilege escalation
      - missing forbidden-access tests

  payments:
    paths:
      - app/payments/**
    required_review:
      - webhook signature validation
      - idempotency
      - replay protection
      - transaction boundaries
      - audit trail
      - duplicate provider event tests

  ci_cd:
    paths:
      - .github/workflows/**
      - Dockerfile
      - .docker/**
    required_review:
      - least-privilege permissions
      - secret exposure
      - unpinned third-party actions
      - unsafe pull_request_target usage
      - deployment bypasses

