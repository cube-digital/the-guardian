name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  security:
    name: Security Gate
    uses: your-org/engineering-platform/.github/workflows/security.yml@v1
    with:
      codeql-languages: '["python"]'
      dependency-review-config: .github/policies/dependency-review.yml
      trivy-scan-ref: .
      semgrep-config: p/default
    secrets: inherit

