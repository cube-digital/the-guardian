name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    uses: your-org/engineering-platform/.github/workflows/python-django-ci.yml@v1
    with:
      python-version: "3.13"
      install-command: uv sync --frozen
      lint-command: uv run ruff check .
      format-check-command: uv run ruff format --check .
      django-check-command: uv run python manage.py check
      migration-check-command: uv run python manage.py makemigrations --check --dry-run
      test-command: uv run pytest --junitxml=reports/pytest.xml
    secrets: inherit

