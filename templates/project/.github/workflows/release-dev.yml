name: Release Development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  release:
    uses: your-org/engineering-platform/.github/workflows/docker-ecs-release.yml@v1
    with:
      environment: dev
      aws-region: eu-west-2
      aws-role-to-assume: arn:aws:iam::123456789012:role/github-dev-deployer
      ecr-registry: 123456789012.dkr.ecr.eu-west-2.amazonaws.com
      image-manifest-path: .github/images.json
      ecs-cluster-name: example-dev-cluster
      task-definition-template-dir: .deploy/ecs
      smoke-command: curl -fsS https://api.dev.example.com/api/health/
    secrets: inherit

